<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Amazon-Checkout</title>
    <link
      rel="stylesheet"
      href="../Amazon.Css/Amazon-checkout.css"
    />
    <link
      rel="stylesheet"
      href="../Amazon.Css/Amazon-header-.css"
    />
    <link
      rel="stylesheet"
      href="../Amazon.Css/Amazon-main.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="checkout-header">
      <a href="./amazon-homepage.html">
        <img
          class="amazon-logo"
          src="../Amazon images/amazon-logo-black. Amazon.png"
        />
      </a>
      <p class="header-p1">
        Checkout (
        <a href="./amazon-homepage.html">
          <span class="header-p1-span js-header-p1-span"></span>
        </a>
        )
      </p>
      <img
        class="checkout-lock-icon"
        src="../Amazon images/checkout-lock-icon.Amazon.png"
      />
    </header>
    <main class="checkout-main">
      <p class="checkout-row1">Review your order</p>
      <div class="Product-order-parent-div js-Product-order-parent-div"></div>
    </main>
    <script
      type="module"
      src="../Amazon Js/Amazon-checkout/Amazon-checkout.js"
    ></script>
  </body>
</html>
