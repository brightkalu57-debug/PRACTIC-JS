<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Document</title>
    <link
      rel="stylesheet"
      href="../Amazon.Css/Amazon-header-.css"
    />
    <link
      rel="stylesheet"
      href="../Amazon.Css/Amazon-placedorder.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <header class="heading">
        <a href="../Amazon html/amazon.html">
          <img
            class="header-img-column1"
            src="../Amazon images/amazon-logo-white.png"
          />
        </a>
        <div class="header-column2">
          <input placeholder="Search " />
          <button>
            <img src="../Amazon images/search-icon- Amazon.png" />
          </button>
        </div>
        <a href="../Amazon html/Amazon-placedorder.html">
          <p class="header-p-column3">Returns<span> & Orders</span></p>
        </a>
        <a href="../Amazon html/Amazon-checkout.html">
          <div class="header-column4">
            <img src="../Amazon images/cart-icon. Amazon.png" />
            <p class="header-column4-p1">Cart</p>
            <p class="header-column4-p2 js-header-column4-p2">0</p>
          </div>
        </a>
      </header>
      <p class="page-title">Your Orders</p>
      <div class="Order-container">
        <div class="Order-container-header">
          <div class="Order-container-header-leftside">
            <div class="Order-container-header-leftside-div1">
              <p class="Order-container-header-leftside-div1-p1">
                Order Placed:
              </p>
              <p class="Order-container-header-leftside-div1-p2">July 14</p>
            </div>
            <div class="Order-container-header-leftside-div2">
              <p class="Order-container-header-leftside-div2-p1">Total:</p>
              <p class="Order-container-header-leftside-div2-p2">$35.06</p>
            </div>
          </div>
          <div class="Order-container-header-rightside">
            <p class="Order-container-header-rightside-p1">Order ID:</p>
            <p class="Order-container-header-rightside-p2">
              27cba69d-4c3d-4098-b42d-ac7fa62b7664
            </p>
          </div>
        </div>
        <div class="Order-container-body-grid">
          <div class="Order-container-body-grid-imgdiv">
            <img
              class="Order-container-body-grid-imgdiv-img"
              src="../Amazon images/athletic-cotton-socks-6-pair. Amazon.jpg"
            />
          </div>
          <div class="Order-container-body-grid-proudctdetails">
            <p class="Order-container-body-grid-proudctdetails-name">
              Black and Gray Athletic Cotton Socks - 6 Pairs
            </p>
            <p class="Order-container-body-grid-proudctdetails-deliverydate">
              Delivered on: July 17
            </p>
            <p class="Order-container-body-grid-proudctdetails-quantity">
              Quantity: 1
            </p>
            <button
              class="Order-container-body-grid-proudctdetails-buy_again_btn"
            >
              <img src="../Amazon images/buy-again-bttn-icon.png" />
              Buy it again
            </button>
          </div>
          <div class="Order-container-body-grid-trackpackage_btn_div">
            <button class="Order-container-body-grid-trackpackage_btn">
              Track Package
            </button>
          </div>
        </div>
      </div>
    </main>
    <script
      type="module"
      src="../Amazon Js/Amazon-main.js"
    ></script>
  </body>
</html>
